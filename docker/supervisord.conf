[supervisord]
nodaemon=true

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/data -c listen_addresses='*' -c shared_preload_libraries='vector'
user=postgres
autorestart=true
priority=10

[program:meilisearch]
command=/usr/local/bin/meilisearch --db-path /var/lib/meilisearch --http-addr 0.0.0.0:7700 --master-key ${MEILISEARCH_KEY}
autorestart=true
priority=20

[program:ollama]
command=/usr/local/bin/ollama serve
autorestart=true
priority=15
environment=OLLAMA_HOST="0.0.0.0:11434",OLLAMA_NUM_GPU="1"

[program:backend]
command=python /app/backend/app.py
autorestart=true
priority=30
environment=PYTHONUNBUFFERED=1
